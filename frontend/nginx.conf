server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA deep-links (/ai, /room/:id, ...) -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must always be revalidated so a
    # new deploy is never masked by a cached bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Charlie brain REST API (internal network only)
    location /api/ {
        proxy_pass http://api:9300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off; # SSE / streaming endpoints
        proxy_read_timeout 3600s;
    }

    # Chat WebSocket -> setupChatServer({ server, path: '/ws/chat' })
    location /ws/ {
        proxy_pass http://api:9300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
