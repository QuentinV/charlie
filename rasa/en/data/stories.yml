version: '3.1'

stories:
    - story: greet user
      steps:
          - intent: greet
          - action: utter_greet

    - story: ask weather
      steps:
          - intent: ask_weather
          - action: action_get_weather

    - story: get device state
      steps:
          - intent: get_device_state
          - action: action_get_device_state

    - story: set device state
      steps:
          - intent: set_device_state
          - action: action_set_device_state

    # Optional: multi-turn example
    - story: multi turn device clarification
      steps:
          - intent: set_device_state
            entities:
                - state: 'on'
          - action: action_set_device_state
          - intent: get_device_state
            entities:
                - device: 'living room light'
          - action: action_get_device_state

    # Optional: follow-up after weather
    - story: weather then device
      steps:
          - intent: ask_weather
          - action: action_get_weather
          - intent: get_device_state
          - action: action_get_device_state
