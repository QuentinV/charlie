version: '3.1'

rules:
    - rule: greet
      steps:
          - intent: greet
          - action: utter_greet

    - rule: weather
      steps:
          - intent: ask_weather
          - action: action_get_weather

    - rule: get device state
      steps:
          - intent: get_device_state
          - action: action_get_device_state

    - rule: set device state
      steps:
          - intent: set_device_state
          - action: action_set_device_state
