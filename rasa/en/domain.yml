version: '3.1'

intents:
    - greet
    - ask_weather
    - get_device_state
    - set_device_state

entities:
    - device
    - state

slots:
    device:
        type: text
    state:
        type: text

responses:
    utter_greet:
        - text: 'Hello! How can I help you?'

session_config:
    session_expiration_time: 60
    carry_over_slots_to_new_session: true
