version: '3.1'

recipe: default.v1

assistant_id: rasa-nlu-optimized

language: en

pipeline:
    - name: WhitespaceTokenizer
    - name: RegexFeaturizer
    - name: LexicalSyntacticFeaturizer

    # Transformer embeddings (heavy but very accurate)
    - name: LanguageModelFeaturizer
      model_name: 'bert'
      model_weights: 'bert-base-uncased'
      cache_dir: null

    # Word-level features for robustness
    - name: CountVectorsFeaturizer
      analyzer: word
      min_ngram: 1
      max_ngram: 2

    # Character-level features for typos
    - name: CountVectorsFeaturizer
      analyzer: char_wb
      min_ngram: 3
      max_ngram: 5

    # DIET classifier with more epochs for accuracy
    - name: DIETClassifier
      epochs: 200
      constrain_similarities: true
      transformer_size: 256
      batch_size: [32, 64]
      learning_rate: 0.0001
      embedding_dimension: 128

    - name: EntitySynonymMapper

    # Response selector (not used much but improves robustness)
    - name: ResponseSelector
      epochs: 100

    # Fallback for LLM handoff
    - name: FallbackClassifier
      threshold: 0.45
      ambiguity_threshold: 0.1

policies:
    - name: RulePolicy
      core_fallback_threshold: 0.3
      core_fallback_action_name: 'action_default_fallback'
      enable_fallback_prediction: true

    - name: MemoizationPolicy
      max_history: 5

    - name: TEDPolicy
      max_history: 5
      epochs: 50
