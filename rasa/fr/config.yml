version: '3.1'

recipe: default.v1

assistant_id: rasa-nlu-fr-optimized

language: fr

pipeline:
    # Tokenization adapted to French spacing and apostrophes
    - name: WhitespaceTokenizer
      intent_tokenization_flag: false
      token_pattern: None

    - name: RegexFeaturizer
    - name: LexicalSyntacticFeaturizer

    # Transformer embeddings (excellent for French)
    - name: LanguageModelFeaturizer
      model_name: 'camembert'
      model_weights: 'camembert-base'
      cache_dir: null

    # Word-level n-grams (helps with short commands)
    - name: CountVectorsFeaturizer
      analyzer: word
      min_ngram: 1
      max_ngram: 2

    # Character-level n-grams (handles typos + French morphology)
    - name: CountVectorsFeaturizer
      analyzer: char_wb
      min_ngram: 3
      max_ngram: 6

    # DIET classifier with more training for accuracy
    - name: DIETClassifier
      epochs: 200
      constrain_similarities: true
      transformer_size: 256
      batch_size: [32, 64]
      learning_rate: 0.0001
      embedding_dimension: 128

    - name: EntitySynonymMapper

    # Helps with FAQ-style responses if you add them later
    - name: ResponseSelector
      epochs: 100

    # LLM fallback trigger
    - name: FallbackClassifier
      threshold: 0.45
      ambiguity_threshold: 0.1

policies:
    - name: RulePolicy
      core_fallback_threshold: 0.3
      core_fallback_action_name: 'action_default_fallback'
      enable_fallback_prediction: true

    - name: MemoizationPolicy
      max_history: 5

    - name: TEDPolicy
      max_history: 5
      epochs: 100
