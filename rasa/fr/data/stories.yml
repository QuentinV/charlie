    - story: Close shutter
      steps:
          - intent: close_shutter
          - action: utter_ack

    - story: Pause shutter
      steps:
          - intent: pause_shutter
          - action: utter_ack

    ######################################################################
    # GROUP COMMANDS
    ######################################################################

    - story: Turn on group
      steps:
          - intent: turn_on_group
