version: '3.1'
stories:
    ######################################################################
    # BASIC DEVICE CONTROL
    ######################################################################

    - story: Turn on a device
      steps:
          - intent: turn_on_device
          - action: utter_ack

    - story: Turn off a device
      steps:
          - intent: turn_off_device
          - action: utter_ack

    - story: Set device value
      steps:
          - intent: set_device_value
          - action: utter_ack

    - story: Increase device value
      steps:
          - intent: increase_device_value
          - action: utter_ack

    - story: Decrease device value
      steps:
          - intent: decrease_device_value
          - action: utter_ack

    - story: Query device state
      steps:
          - intent: query_device_state
          - action: utter_ack

    ######################################################################
    # ENVIRONMENT CONTROL
    ######################################################################

    - story: Set temperature
      steps:
          - intent: set_temperature
          - action: utter_ack

    - story: Increase temperature
      steps:
          - intent: increase_temperature
          - action: utter_ack

    - story: Decrease temperature
      steps:
          - intent: decrease_temperature
          - action: utter_ack

    - story: Set brightness
      steps:
          - intent: set_brightness
          - action: utter_ack

    - story: Increase brightness
      steps:
          - intent: increase_brightness
          - action: utter_ack

    - story: Decrease brightness
      steps:
          - intent: decrease_brightness
          - action: utter_ack

    - story: Set volume
      steps:
          - intent: set_volume
          - action: utter_ack

    - story: Increase volume
      steps:
          - intent: increase_volume
          - action: utter_ack

    - story: Decrease volume
      steps:
          - intent: decrease_volume
