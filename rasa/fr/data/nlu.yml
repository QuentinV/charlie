version: '3.1'
nlu:
    ######################################################################
    # DEVICE CONTROL
    ######################################################################

    - intent: turn_on_device
      examples: |
          - allume la [lampe](device)
          - allume la [lumière](device) du [salon](room)
          - mets en marche le [ventilateur](device)
          - active la [prise](device)
          - allume les [lumières](device) dans la [cuisine](room)
          - allume le [chauffage](device)
          - allume la [TV](device)
          - allume la [machine à café](device)
          - allume le [déshumidificateur](device)
          - allume la [guirlande](device)
          - allume la lumière du [bureau](room)
          - allume la lampe du [couloir](room)
          - allume la lumire du [salon](room)   # typo‑tolerance
          - allume la lumierre dans la [cuisine](room)   # typo‑tolerance
          - allume la [lumière](device) du [salon](room) et la [lampe](device) du [bureau](room)
          - allume la [lampe](device) du [salon](room) et la [guirlande](device) du [jardin](room)

    - intent: turn_off_device
      examples: |
          - éteins la [lampe](device)
          - coupe la [lumière](device) du [salon](room)
          - arrête le [ventilateur](device)
          - désactive la [prise](device)
          - éteins toutes les [lumières](device) dans la [cuisine](room)
          - éteins le [chauffage](device)
          - éteins la [TV](device)
          - coupe la [machine à café](device)
          - arrête le [déshumidificateur](device)
          - éteins la [guirlande](device)
          - éteins la lumière du [bureau](room)
          - coupe la lampe du [couloir](room)
          - eteins la [lampe](device)   # typo‑tolerance
          - etein la lumiere du [salon](room)   # typo‑tolerance
          - éteins la [lumière](device) du [salon](room) et la [lampe](device) de la [cuisine](room)
          - coupe la [TV](device) et le [chauffage](device) du [salon](room)

    - intent: set_device_value
      examples: |
          - règle le [ventilateur](device) à [3](value)
          - mets la [TV](device) sur [20](value)
          - mets la [lumière](device) à [50](value) pour cent
          - règle la [prise](device) à [80](value)
          - mets le [chauffage](device) sur [2](value)
          - mets la [lampe](device) à [10](value)
          - règle le [déshumidificateur](device) à [40](value)
          - mets la [guirlande](device) à [30](value)
          - règle la [machine à café](device) sur [1](value)
          - mets le [ventilateur](device) à [5](value)
          - mets la lumière à [max](value)
          - mets la lumière au [minimum](value)
          - mets la [lumière](device) du [salon](room) à [30](value) et le [chauffage](device) à [21](value)
          - règle la [TV](device) sur [15](value) et la [lampe](device) à [40](value)

    - intent: increase_device_value
      examples: |
          - augmente la puissance du [ventilateur](device)
          - monte un peu la [lumière](device)
          - augmente le niveau de la [TV](device)
          - mets la [lampe](device) un peu plus fort
          - augmente la puissance du [chauffage](device)
          - monte la [guirlande](device)
          - augmente la vitesse du [ventilateur](device)
          - mets la [prise](device) plus haut
          - augmente la luminosité de la [lampe](device)
          - monte la [machine à café](device)
          - augmente la lumière [un peu](value)
          - augmente la lumière [beaucoup](value)
          - augmente la [lumière](device) du [salon](room) et la [lampe](device) du [bureau](room)
          - augmente la puissance du [chauffage](device) et la vitesse du [ventilateur](device)

    - intent: decrease_device_value
      examples: |
          - baisse la puissance du [ventilateur](device)
          - diminue la [lumière](device)
          - baisse le niveau de la [TV](device)
          - mets la [lampe](device) plus bas
          - baisse la puissance du [chauffage](device)
          - baisse la [guirlande](device)
          - diminue la vitesse du [ventilateur](device)
          - mets la [prise](device) plus bas
          - baisse la luminosité de la [lampe](device)
          - baisse la [machine à café](device)
          - baisse la lumière [un peu](value)
          - baisse la lumière [beaucoup](value)
          - baisse la [lumière](device) du [salon](room) et la [lampe](device) de la [cuisine](room)
          - diminue la vitesse du [ventilateur](device) et la puissance du [chauffage](device)

    - intent: query_device_state
      examples: |
          - est‑ce que la [lampe](device) est allumée ?
          - la [lumière](device) du [salon](room) est allumée ?
          - le [chauffage](device) fonctionne ?
          - la [TV](device) est allumée ?
          - est‑ce que le [ventilateur](device) tourne ?
          - la [prise](device) est activée ?
          - la [guirlande](device) est allumée ?
          - est‑ce que la [machine à café](device) est en marche ?
          - la [lumière](device) de la [cuisine](room) est éteinte ?
          - le [déshumidificateur](device) est actif ?
          - la lumire du [salon](room) est allumée ?   # typo‑tolerance
          - la [lumière](device) du [salon](room) et celle de la [cuisine](room) sont allumées ?

