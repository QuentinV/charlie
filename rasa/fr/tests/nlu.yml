version: '3.1'
nlu:
    ######################################################################
    # DEVICE CONTROL
    ######################################################################

    - intent: turn_on_device
      examples: |
          - allume la lumière du salon
          - active la lampe du bureau
          - allume la lumire de la cuisine   # typo
          - allume la lumière du salon et la lampe du bureau

    - intent: turn_off_device
      examples: |
          - éteins la lampe du salon
          - coupe la lumière de la cuisine
          - eteins la lumiere du bureau   # typo
          - éteins la lumière du salon et de la cuisine

    - intent: set_device_value
      examples: |
          - mets la lumière à 40 pour cent
          - règle le ventilateur à 3
          - mets la lumière au max
          - mets la lumière du salon à 30 et le chauffage à 21

    - intent: increase_device_value
      examples: |
          - augmente la lumière
          - monte un peu la lampe du salon
          - augmente la lumire du bureau   # typo
          - augmente la lumière du salon et de la cuisine

    - intent: decrease_device_value
      examples: |
          - baisse la lumière
          - diminue la lampe du salon
          - baisse la lumire de la cuisine   # typo
          - baisse la lumière du salon et du bureau

    - intent: query_device_state
      examples: |
          - est‑ce que la lumière du salon est allumée ?
          - la lampe de la cuisine est éteinte ?
          - la lumire du salon est allumée ?   # typo
          - la lumière du salon et de la cuisine sont allumées ?

    ######################################################################
    # TEMPERATURE
    ######################################################################

    - intent: set_temperature
      examples: |
          - mets le salon à 21 degrés
          - règle la chambre à 19
          - mets la cuisine à 20
          - mets le salon à 21 et la chambre à 19

    - intent: increase_temperature
      examples: |
          - augmente la température du salon
          - fais plus chaud dans la chambre
          - chauffe un peu la cuisine
          - augmente la température du salon et de la chambre

    - intent: decrease_temperature
      examples: |
          - baisse la température du salon
          - fais plus frais dans la chambre
          - refroidis un peu la cuisine
          - baisse la température du salon et de la cuisine

    ######################################################################
    # BRIGHTNESS
    ######################################################################

    - intent: set_brightness
      examples: |
          - mets la lumière du salon à 40
          - règle la lampe à 60
          - mets la lumière au minimum
          - mets la lumière du salon à 30 et celle de la cuisine à 50

    - intent: increase_brightness
      examples: |
          - augmente la luminosité du salon
          - éclaire un peu plus la cuisine
          - augmente la lumino du salon   # typo
          - augmente la luminosité du salon et de la cuisine

    - intent: decrease_brightness
      examples: |
          - baisse la luminosité du salon
          - mets la lampe plus bas
          - baisse la lumino de la cuisine   # typo
          - baisse la luminosité du salon et de la chambre

    ######################################################################
    # VOLUME
    ######################################################################

    - intent: set_volume
      examples: |
          - mets le volume à 30
          - règle le son à 20
          - mets le volume au max
          - mets le volume du salon à 30 et celui du bureau à 20

    - intent: increase_volume
      examples: |
          - augmente le volume
          - monte un peu le son
          - augmente le volme du salon   # typo
          - augmente le volume du salon et de la cuisine

    - intent: decrease_volume
      examples: |
          - baisse le volume
          - mets le son plus bas
          - baisse le volme du bureau   # typo
          - baisse le volume du salon et de la cuisine

    ######################################################################
    # SHUTTERS
    ######################################################################

    - intent: open_shutter
      examples: |
          - ouvre les volets du salon
          - remonte le volet de la chambre
          - ouvre les volet du salon   # typo
          - ouvre les volets du salon et de la chambre

    - intent: close_shutter
      examples: |
          - ferme les volets du salon
          - baisse le volet de la chambre
          - ferme les volet du salon   # typo
          - ferme les volets du salon et de la cuisine

    - intent: pause_shutter
      examples: |
          - stoppe le volet
          - mets les volets en pause
          - pause les volets du salon
          - mets en pause les volets du salon et de la chambre

    ######################################################################
    # GROUP COMMANDS
    ######################################################################

    - intent: turn_on_group
      examples: |
          - allume toutes les lumières
          - allume tout dans le salon
          - allume toutes les lumieres   # typo
          - allume toutes les lumières du salon et de la cuisine

    - intent: turn_off_group
      examples: |
          - éteins toutes les lumières
          - éteins tout dans le salon
          - eteins toutes les lumieres   # typo
          - éteins toutes les lumières du salon et de la cuisine

    ######################################################################
    # TIMERS
    ######################################################################

    - intent: set_timer
      examples: |
          - mets un minuteur de 10 minutes
          - lance un minuteur de 5 minutes
          - mets un minuteur dans 10 minutes
          - mets un minuteur de 10 minute   # typo

    - intent: cancel_timer
      examples: |
          - annule le minuteur
          - stoppe le minuteur
          - annule le minutteur   # typo

    - intent: pause_timer
      examples: |
          - mets le minuteur en pause
          - pause le minuteur
          - pause le minutteur   # typo

    - intent: resume_timer
      examples: |
          - reprends le minuteur
          - continue le minuteur
          - relance le minuteur

    - intent: query_time_remaining
      examples: |
          - il reste combien de temps ?
          - combien reste‑t‑il sur le minuteur ?
          - il reste combien de temp ?   # typo

    ######################################################################
    # ALARMS
    ######################################################################

    - intent: set_alarm
      examples: |
          - mets une alarme à 7h
          - réveille‑moi à 6h30
          - mets une alarme demain matin
          - mets une alarme dans 10 minutes

    - intent: cancel_alarm
      examples: |
          - annule l’alarme
          - supprime l’alarme
          - annule l'alarmee   # typo

    ######################################################################
    # WEATHER
    ######################################################################

    - intent: get_weather
      examples: |
          - quel temps fait‑il ?
          - il va pleuvoir ?
          - météo pour Paris
          - il va pleuvoir a Pari   # typo

    ######################################################################
    # MUSIC
    ######################################################################

    - intent: play_music
      examples: |
          - joue de la musique
          - mets une chanson
          - joue de la music   # typo

    - intent: pause_music
      examples: |
          - mets la musique en pause
          - arrête la musique

    - intent: resume_music
      examples: |
          - reprends la musique
          - continue la musique

    - intent: next_track
      examples: |
          - piste suivante
          - chanson suivante

    - intent: previous_track
      examples: |
          - piste précédente
          - chanson précédente

    ######################################################################
    # SYNONYM TESTS
    ######################################################################

    - intent: set_device_value
      examples: |
          - mets la lumière au maximum
          - mets la lumière au minimum
          - mets la lumière à fond
          - mets la lumière un chouïa plus fort

    - intent: increase_device_value
      examples: |
          - augmente un peu la lumière
          - augmente beaucoup la lampe
          - mets la lumière légèrement plus fort

    - intent: decrease_device_value
      examples: |
          - baisse un peu la lumière
          - baisse beaucoup la lampe
          - mets la lumière légèrement plus bas

    ######################################################################
    # VALUE-ONLY TESTS
    ######################################################################

    - intent: set_device_value
      examples: |
          - mets à 20
          - règle à 50
          - mets sur 3

    ######################################################################
    # DEVICE-ONLY TESTS
    ######################################################################

    - intent: turn_on_device
      examples: |
          - allume
          - active
          - mets en marche

    - intent: turn_off_device
      examples: |
          - éteins
          - coupe
          - arrête

    ######################################################################
    # ROOM-ONLY TESTS
    ######################################################################

    - intent: turn_on_group
      examples: |
          - allume dans le salon
          - allume dans la cuisine

    - intent: turn_off_group
      examples: |
          - éteins dans le salon
          - éteins dans la cuisine

    ######################################################################
    # AMBIGUOUS / EDGE CASE TESTS
    ######################################################################

    - intent: turn_on_device
      examples: |
          - mets la lumière
          - allume ça
          - allume ici

    - intent: turn_off_device
      examples: |
          - coupe ça
          - éteins ici

    ######################################################################
    # MULTI-ENTITY STRESS TESTS
    ######################################################################

    - intent: turn_on_device
      examples: |
          - allume la lumière du salon et la lampe du bureau et la guirlande du jardin

    - intent: turn_off_device
      examples: |
          - éteins la lumière du salon, la cuisine et le couloir

    - intent: set_device_value
      examples: |
          - mets la lumière du salon à 30, celle de la cuisine à 50 et le chauffage à 21

    ######################################################################
    # MULTI-INTENT-LIKE PHRASES (still single intent)
    ######################################################################

    - intent: turn_on_device
      examples: |
          - allume la lumière du salon puis ferme les volets
          - allume la lampe et baisse un peu la luminosité

    - intent: set_temperature
      examples: |
          - mets le salon à 21 et fais plus chaud dans la chambre

    ######################################################################
    # TIME EXPRESSION TESTS
    ######################################################################

    - intent: set_timer
      examples: |
          - mets un minuteur pour dans une heure
          - mets un minuteur pour dans un quart d’heure
          - mets un minuteur pour dans deux minutes

    - intent: set_alarm
      examples: |
          - mets une alarme dans deux heures
          - mets une alarme dans une demi‑heure
          - mets une alarme demain soir

    ######################################################################
    # WEATHER EDGE CASES
    ######################################################################

    - intent: get_weather
      examples: |
          - il fait quel temps là maintenant ?
          - météo stp
          - il va faire beau ce week end ?
          - météo à Paris demain matin

    ######################################################################
    # MUSIC EDGE CASES
    ######################################################################

    - intent: play_music
      examples: |
          - mets quelque chose
          - mets un son tranquille
          - mets un truc qui bouge
          - mets ma playlist préférée

    - intent: next_track
      examples: |
          - passe
          - change
          - suivant

    - intent: previous_track
      examples: |
          - revient
          - repasse
          - d’avant
