services:
    api:
        build: ./nodejs-apis
        container_name: charlie-api
        environment:
            - NODE_ENV=production
            - PULSE_SERVER=unix:/tmp/pulse/native
            # HA config dir: lets the brain install community integrations
            # (custom_components/) directly. See homeassistant/README.md.
            - HA_CONFIG_DIR=/ha-config
        volumes:
            - ./nodejs-apis/src:/app/src
            - ./nodejs-apis/.env:/app/.env
            - ./nodejs-apis/tsconfig.json:/app/tsconfig.json
            - ~/media/musics:/musics
            - ${XDG_RUNTIME_DIR}/pulse/native:/tmp/pulse/native
            - ./nodejs-apis/recordings:/app/recordings
            - ./nodejs-apis/vision:/app/vision
            # Service tokens the brain mints for co-located services (vision-feed
            # reads this dir); see auth/serviceToken.ts.
            - ./nodejs-apis/.private:/app/.private
            - ./echo-devices:/echo-devices
            - ./homeassistant/config:/ha-config
        ports:
            - '9300:9300' # http server
            - '9303:9303' # audio udp
            - '9304:9304' # mqtt server
        command: 'yarn start'
        depends_on:
            - db
        restart: unless-stopped
        networks:
            - internal
        extra_hosts:
            - 'host.docker.internal:host-gateway'
    network-scanner:
        build: ./network-scanner
        container_name: charlie-network-scanner
        environment:
            - NODE_ENV=production
        volumes:
            - ./network-scanner/src:/app/src
        ports:
            - '9306:9306'
        command: 'yarn start'
        restart: unless-stopped
        network_mode: host
        cap_add:
            - NET_ADMIN
            - NET_RAW
    tts:
        build: ./tts
        container_name: charlie-tts
        ports:
            - '9301:8000'
        volumes:
            - ./tts/app:/app
        restart: unless-stopped
        networks:
            - internal
    asr:
        container_name: charlie-asr
        ports:
            - '9307:10300'
        build: ./asr
        environment:
            - NUM_THREADS=4
        restart: unless-stopped
        volumes:
            - ./asr/models:/app/models
        networks:
            - internal
    # GPU build: uses the CUDA llama.cpp server image and offloads all layers.
    # Requires an NVIDIA driver + nvidia-container-toolkit on the host.
    llm:
        build:
            context: ./llm
            args:
                LLAMA_BASE: ghcr.io/ggml-org/llama.cpp:server-cuda
        container_name: charlie-llm
        networks:
            - internal
        ports:
            - '9308:9308'
        volumes:
            - ./llm/models:/app/models
        environment:
            # Router mode: one server, several models, loaded on demand and kept
            # warm. The vision model (Qwen3-VL + its mmproj, see the "+" in
            # MODELS) stays on the CPU — presets/charlie.ini pins its layers to 0
            # and disables the projector offload, so its ~3.5 GB never compete
            # with the chat model for VRAM.
            # On a GPU with little VRAM, set LLM_MODELS_MAX=1 (the router then
            # evicts the model that is not in use) and/or
            # LLM_SLEEP_IDLE_SECONDS=900 to unload the idle one.
            - MODELS=${LLM_MODELS:-qwen3-4b=unsloth/Qwen3-4B-Instruct-2507-GGUF/Qwen3-4B-Instruct-2507-UD-Q4_K_XL.gguf,qwen3-1.7b=unsloth/Qwen3-1.7B-GGUF/Qwen3-1.7B-UD-Q4_K_XL.gguf,qwen3vl-4b=Qwen/Qwen3-VL-4B-Instruct-GGUF/Qwen3VL-4B-Instruct-Q4_K_M.gguf+Qwen/Qwen3-VL-4B-Instruct-GGUF/mmproj-Qwen3VL-4B-Instruct-F16.gguf,smolvlm-500m=ggml-org/SmolVLM2-500M-Video-Instruct-GGUF/SmolVLM2-500M-Video-Instruct-Q8_0.gguf+ggml-org/SmolVLM2-500M-Video-Instruct-GGUF/mmproj-SmolVLM2-500M-Video-Instruct-Q8_0.gguf}
            # Models loaded at the same time (LRU eviction above that). 3 keeps
            # chat + small + the tiny fast-VLM warm; set 2 on a VRAM-tight GPU.
            - MODELS_MAX=${LLM_MODELS_MAX:-3}
            # Per-model tuning (ctx/batch/threads, vision kept on CPU) lives in
            # presets/charlie.ini.
            # - MODELS_PRESET=  # empty disables the per-model tuning
            # - LLAMA_SLEEP_IDLE_SECONDS=${LLM_SLEEP_IDLE_SECONDS:-900}
            - LLAMA_ARG_N_GPU_LAYERS=${LLAMA_ARG_N_GPU_LAYERS:-99}
            - LLAMA_ARG_FLASH_ATTN=on
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        # The base image healthchecks port 8080; this server listens on 9308.
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9308/health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        restart: unless-stopped
    vision-feed:
        build: ./vision-feed
        container_name: charlie-vision-feed
        environment:
            - BRAIN_URL=${BRAIN_URL:-http://api:9300}
            # The brain mints this service token at boot; vision-feed reads it.
            - BRAIN_TOKEN_FILE=/app/.private/vision-feed.token
            # Frames/s the loop samples: the detector runs at its own cadence
            # (VISION_FEED_DETECT_FPS, 5/s) inside a motion burst.
            - VISION_FEED_FPS=${VISION_FEED_FPS:-5}
            - VISION_FEED_THREADS=${VISION_FEED_THREADS:-2}
            # How long a track survives a missed detection before it has left.
            # Shared by the tracker and the policy (one knob), so the id is retired
            # exactly when the `leave` is posted. 1 s was the churn: it equals the
            # gap between two detections at 5/s, so one blink of the detector
            # retired the track and the next detection minted a new id.
            - VISION_MISS_TTL_S=${VISION_MISS_TTL_S:-2}
            # The detector's cadence in a room the gate calls quiet (`loop.look_fps`):
            # a watchdog, not a schedule, and never 0. A still person is absorbed into
            # the gate's background, and gating this on "a track is already alive" left
            # the camera blind exactly when it mattered — the track expired, the
            # detector stopped looking altogether, and the person came back as a new id
            # (the enter/leave churn). At least two looks per miss TTL, so someone
            # standing still can never age out between two looks.
            - VISION_QUIET_DETECT_FPS=${VISION_QUIET_DETECT_FPS:-1}
            # Stream reopen backoff (seconds): doubles from MIN to MAX while the source
            # refuses to open. A relayed MJPEG stream or a loopback webcam helper is
            # back in milliseconds — the old ladder ran to 30 s, half a minute blind.
            - VISION_REOPEN_MIN_S=${VISION_REOPEN_MIN_S:-0.2}
            - VISION_REOPEN_MAX_S=${VISION_REOPEN_MAX_S:-2}
        volumes:
            - ./vision-feed:/app
            - ./vision-feed/models:/app/models
            - ./nodejs-apis/.private:/app/.private:ro
        cpuset: '2,3'
        # devices:
        #     - /dev/video0:/dev/video0
        ports:
            - '9311:9311'
        restart: unless-stopped
        networks:
            - internal
    voiceprofiler:
        build: ./voiceprofiler
        container_name: charlie-voice-profiler
        restart: unless-stopped
        environment:
            # Cosine a mystery utterance must reach to be named.
            - VOICE_MATCH_THRESHOLD=${VOICE_MATCH_THRESHOLD:-0.65}
            # Held-out verification score required to commit a new profile.
            - VOICE_ENROLL_THRESHOLD=${VOICE_ENROLL_THRESHOLD:-0.50}
            # Minimum leave-one-out agreement between enrolment samples.
            - VOICE_MIN_CONSISTENCY=${VOICE_MIN_CONSISTENCY:-0.45}
            # Quality gates for a recorded sentence.
            - VOICE_MIN_SAMPLE_SECONDS=${VOICE_MIN_SAMPLE_SECONDS:-1.2}
            - VOICE_MIN_RMS_DB=${VOICE_MIN_RMS_DB:--55}
            # Raw-score range mapped to the display-only 0..1 confidence.
            - VOICE_SCORE_FLOOR=${VOICE_SCORE_FLOOR:-0.20}
            - VOICE_SCORE_CEIL=${VOICE_SCORE_CEIL:-0.80}
        ports:
            - "9309:10400"
            - "9310:8000"
        volumes:
            - ./voiceprofiler/data:/app/data
            - ./voiceprofiler/models:/app/models
        networks:
            - internal
    db:
        container_name: charlie-db
        image: mongo
        ports:
            - '9302:27017'
        restart: unless-stopped
        volumes:
            - ./db:/data/db
        environment:
            - MONGO_INITDB_ROOT_USERNAME=
            - MONGO_INITDB_ROOT_PASSWORD=
        networks:
            - internal
    homeassistant:
        build: ./homeassistant
        container_name: charlie-homeassistant
        environment:
            - TZ=Europe/Paris
            # - HA_TRUSTED_NETWORKS=172.16.0.0/12,127.0.0.1  # optional override
        volumes:
            - ./homeassistant/config:/config
        ports:
            #    - '127.0.0.1:8123:8123' # loopback only (device-provider layer)
            - '8123:8123'
        restart: unless-stopped
        networks:
            - internal
    frontend:
        build: ./frontend
        container_name: charlie-frontend
        ports:
            - '9305:80'
        depends_on:
            - api
        restart: unless-stopped
        networks:
            - internal

networks:
    internal:
        driver: bridge
    charlieExternal:
        external: true
