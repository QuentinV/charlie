<script type="text/javascript">
    RED.nodes.registerType('charlie-device', {
        category: 'Charlie',
        paletteLabel: 'Device',
        color: '#fff',
        defaults: {
            name: { value: '' },
            id: { value: '' },
            deviceType: { value: 'light' },
            externalId: { value: '' },
            outputs: { value: 2 },
        },
        inputs: 1,
        outputs: function () {
            const n = Number(this.outputs);
            return isNaN(n) ? 2 : n;
        },
        outputLabels: function (index) {
            return index === 0 ? 'On' : index === 1 ? 'Off' : 'Pause';
        },
        icon: 'device.png',
        label: function () {
            return this.name || 'Device';
        },
        oneditsave: function () {
            const type = $('#node-input-deviceType').val();
            this.outputs = type === 'shutter' ? 3 : 2;
        },
    });
</script>

<script type="text/x-red" data-template-name="charlie-device">
    <form id="dialog-form" class="form-horizontal" autocomplete="off">
        <div class="form-row">
            <label for="node-input-id">Id</label>
            <input id="node-input-id" required />
        </div>

        <div class="form-row">
            <label for="node-input-name">Name</label>
            <input id="node-input-name" required />
        </div>

        <div class="form-row">
            <label for="node-input-externalId">External id</label>
            <input id="node-input-externalId" required />
        </div>

        <div class="form-row">
            <label for="node-input-deviceType">Type</label>
            <select id="node-input-deviceType" required>
                <option value="light">Light</option>
                <option value="switch">Switch</option>
                <option value="shutter">Shutter</option>
            </select>
        </div>
    </form>
</script>
