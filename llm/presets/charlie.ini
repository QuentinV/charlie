# Per-model arguments for llama-server router mode (--models-preset).
#
# This file is the ONLY place where per-model tuning is defined: the image and
# the compose files set no context size, batch or thread count (they only choose
# which models to serve and how many stay loaded).
#
# The file is used by default (llm/presets/charlie.ini in the image) and is
# validated by the entrypoint before being passed: a section that matches no
# served model, or a key this build does not know, makes the entrypoint ignore
# the file instead of failing to start. Disable with MODELS_PRESET="".
#
# How the binding works (common/preset.cpp):
#   * every folder under --models-dir (see MODELS in the Dockerfile) becomes a
#     preset named after the folder: `qwen3-4b`, `qwen2.5-1.5b`;
#   * the section of the same name is merged *over* that auto-generated preset,
#     so it only has to list what differs from the CLI/env defaults;
#   * keys are the option env names (`LLAMA_ARG_CTX_SIZE`), as documented by
#     `llama-server --help`;
#   * never set the model path here (LLAMA_ARG_MODEL): the router fills it from
#     the folder scan, and overriding it would point both models at one file.

# Chat model: agentic fallback, tools, memory summary.
[qwen3-4b]
LLAMA_ARG_CTX_SIZE = 4096
LLAMA_ARG_BATCH = 1024
LLAMA_ARG_THREADS = 6

# Small model: background jobs (shopping list structuring). Half the context is
# plenty and saves KV-cache memory while both models stay warm.
[qwen2.5-1.5b]
LLAMA_ARG_CTX_SIZE = 2048
LLAMA_ARG_BATCH = 512
LLAMA_ARG_THREADS = 4
