services:
    api:
        build: ./nodejs-apis
        container_name: charlie-api
        environment:
            - NODE_ENV=production
            - PULSE_SERVER=unix:/tmp/pulse/native
        volumes:
            - ./nodejs-apis/src:/app/src
            - ./nodejs-apis/.env:/app/.env
            - ./nodejs-apis/tsconfig.json:/app/tsconfig.json
            - ~/media/musics:/musics
            - ${XDG_RUNTIME_DIR}/pulse/native:/tmp/pulse/native
            - ./nodejs-apis/recordings:/app/recordings
        ports:
            - '9300:9300' # http server
            - '9303:9303' # audio udp
            - '9304:9304' # mqtt server
        command: 'yarn start'
        depends_on:
            - db
        restart: unless-stopped
        networks:
            - internal
        #devices:
        #    - '/dev/snd:/dev/snd'
    ai-agents:
        build: ./python-apis
        container_name: charlie-ai-agents
        ports:
            - '9301:8000'
        volumes:
            - ./python-apis/app:/app
            - ./nodejs-apis:/mcp-server
            - ./vosk:/vosk
        environment:
            - MISTRAL_API_KEY=${MISTRAL_API_KEY}
            - SSE_HOST=http://${SSE_HOST}:9300/sse
            - VOSK_MODEL_KEY=${VOSK_MODEL_KEY}
            - VOSK_SAMPLE_RATE=${VOSK_SAMPLE_RATE}
        restart: unless-stopped
        networks:
            - internal
    db:
        container_name: charlie-db
        image: mongo
        ports:
            - '9302:27017'
        restart: unless-stopped
        volumes:
            - ./db:/data/db
        environment:
            - MONGO_INITDB_ROOT_USERNAME=
            - MONGO_INITDB_ROOT_PASSWORD=
        networks:
            - internal
    frontend:
        build: ./frontend
        container_name: charlie-frontend
        environment:
            - NODE_ENV=production
            - API_HOST=http://api:9300
        volumes:
            - ./frontend/src:/app/src
            - ./frontend/.env:/app/.env
            - ./frontend/vite.config.js:/app/vite.config.js
        ports:
            - '9305:3000'
        command: 'yarn start --host'
        depends_on:
            - api
        restart: unless-stopped
        networks:
            - internal

networks:
    internal:
        driver: bridge
    charlieExternal:
        external: true
