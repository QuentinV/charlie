services:
    api:
        build: ./nodejs-apis
        container_name: charlie-api
        environment:
            - NODE_ENV=production
            - PULSE_SERVER=unix:/tmp/pulse/native
            # HA config dir: lets the brain install community integrations
            # (custom_components/) directly. See homeassistant/README.md.
            - HA_CONFIG_DIR=/ha-config
        volumes:
            - ./nodejs-apis/src:/app/src
            - ./nodejs-apis/.env:/app/.env
            - ./nodejs-apis/tsconfig.json:/app/tsconfig.json
            - ~/media/musics:/musics
            - ${XDG_RUNTIME_DIR}/pulse/native:/tmp/pulse/native
            - ./nodejs-apis/recordings:/app/recordings
            - ./echo-devices:/echo-devices
            - ./homeassistant/config:/ha-config
        ports:
            - '9300:9300' # http server
            - '9303:9303' # audio udp
            - '9304:9304' # mqtt server
        command: 'yarn start'
        depends_on:
            - db
        restart: unless-stopped
        networks:
            - internal
        extra_hosts:
            - 'host.docker.internal:host-gateway'
    network-scanner:
        build: ./network-scanner
        container_name: charlie-network-scanner
        environment:
            - NODE_ENV=production
        volumes:
            - ./network-scanner/src:/app/src
        ports:
            - '9306:9306'
        command: 'yarn start'
        restart: unless-stopped
        network_mode: host
        cap_add:
            - NET_ADMIN
            - NET_RAW
    tts:
        build: ./tts
        container_name: charlie-tts
        ports:
            - '9301:8000'
        volumes:
            - ./tts/app:/app
        restart: unless-stopped
        networks:
            - internal
    asr:
        container_name: charlie-asr
        ports:
            - '9307:10300'
        build: ./asr
        environment:
            - NUM_THREADS=4
        restart: unless-stopped
        volumes:
            - ./asr/models:/app/models
        networks:
            - internal
    llm:
        build: ./llm
        container_name: charlie-llm
        networks:
            - internal
        ports:
            - '9308:9308'
        volumes:
            - ./llm/models:/app/models
        environment:
            - LLAMA_ARG_THREADS=${LLAMA_ARG_THREADS:-6}
        restart: unless-stopped
    voiceprofiler:
        build: ./voiceprofiler
        container_name: charlie-voice-profiler
        restart: unless-stopped
        ports:
            - "9309:10400"
            - "9310:8000"
        volumes:
            - ./voiceprofiler/data:/app/data
            - ./voiceprofiler/models:/app/models
        networks:
            - internal
    vision:
        image: ghcr.io/ggml-org/llama.cpp:server
        container_name: charlie-vision
        ports:
            - "9311:8080"
        volumes:
            - ./vision/models:/models
        command: >
            -m /models/Qwen3VL-4B-Instruct-Q4_K_M.gguf
            --mmproj /models/mmproj-Qwen3VL-4B-Instruct-F16.gguf
            --host 0.0.0.0
            --port 8080
            --threads 4
            -c 2048
        restart: unless-stopped
    db:
        container_name: charlie-db
        image: mongo
        ports:
            - '9302:27017'
        restart: unless-stopped
        volumes:
            - ./db:/data/db
        environment:
            - MONGO_INITDB_ROOT_USERNAME=
            - MONGO_INITDB_ROOT_PASSWORD=
        networks:
            - internal
    homeassistant:
        build: ./homeassistant
        container_name: charlie-homeassistant
        environment:
            - TZ=Europe/Paris
            # - HA_TRUSTED_NETWORKS=172.16.0.0/12,127.0.0.1  # optional override
        volumes:
            - ./homeassistant/config:/config
        ports:
            #    - '127.0.0.1:8123:8123' # loopback only (device-provider layer)
            - '8123:8123'
        restart: unless-stopped
        networks:
            - internal
    frontend:
        build: ./frontend
        container_name: charlie-frontend
        ports:
            - '9305:80'
        depends_on:
            - api
        restart: unless-stopped
        networks:
            - internal
networks:
    internal:
        driver: bridge
    charlieExternal:
        external: true
