[env:esp32-p4-evboard]
; Pinned to 55.03.311. Do NOT move to 55.03.312 without upgrading PlatformIO Core
; (it needs Core >= 6.2.0 final, and the installed Core reports 6.2.0.post1, a
; pre-release, which fails the semver check).
;
; 55.03.311 expects tool-scons 4.8.1 (package-version 4.40801.0) while PlatformIO
; Core force-installs SCons 4.11.1. pioarduino then deletes packages/tool-scons on
; "version mismatch" and forgets to reinstall it, so the build dies with
; "No module named 'SCons.Tool.FortranCommon'".
; Run `python scripts/fix_pio_tool_scons.py` after any `pio pkg install` /
; `pio upgrade` that reinstalls tool-scons (see docs/P0_INFRASTRUCTURE.md).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-p4-evboard
framework = espidf
; Custom table: nvs + model (TFLite wake word) + storage (SPIFFS, UTF-8 recipes).
; PlatformIO generates the partition binary from this file (the sdkconfig flags
; mirror it so the IDF build system agrees).
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DCORE_DEBUG_LEVEL=3